[project]
name = "sharel"
version = "0.1.0"
description = "ShareX, feature for feature, for the Ubuntu GNOME (Wayland) desktop"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
authors = [{ name = "Andy Hawkins", email = "andy@hawkins.app" }]
dependencies = [
    "pillow>=10",
    "numpy>=1.26",
    "requests>=2.31",
    "qrcode>=7.4",
    "paramiko>=3.4",
    "cryptography>=42",
    "lxml>=5",
]

[project.optional-dependencies]
rembg = ["rembg>=2.0.85", "onnxruntime>=1.17"]

[project.scripts]
sharel = "sharel.cli:main"
sharel-tray = "sharel.ui.tray_helper:main"
sharel-native-host = "sharel.tools.native_host:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "responses>=0.25",
    "pyftpdlib>=1.5.9",
    "aiosmtpd>=1.4",
    "wsgidav>=4.3",
    "cheroot>=10",
    "moto[server]>=5.0",
    "mcp>=1.10",
    "ruff>=0.6",
    "rembg>=2.0.85",
    "onnxruntime>=1.17",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sharel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: drives a real (headless) GNOME Shell session"]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM", "A", "BLE", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012", "SIM105", "B008", "BLE001", "E402"]
